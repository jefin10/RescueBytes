# ─────────────────────────────────────────────────────────────────────────────
# RescueBytes — development stack (live reload)
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Backend:  nodemon watches for changes, restarts automatically
# Frontend: Vite dev server with HMR — edits appear in the browser instantly
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Override backend: use Dockerfile.dev + mount source for live reload
  backend:
    build:
      context: ./RescueBytesWeb/backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./RescueBytesWeb/backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:5173

  # Add Vite dev server for the frontend
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./RescueBytesWeb/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
