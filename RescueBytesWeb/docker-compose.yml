version: "3.9"

services:
  # ── Frontend (Nginx + React) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty - nginx will proxy API calls to backend
        VITE_API_URL: ""
    container_name: rescuebytes-frontend
    restart: unless-stopped
    ports:
      - "80:80"      # Main web access
      - "443:443"    # HTTPS (if you add SSL later)
    depends_on:
      - backend
    networks:
      - rescuebytes-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Backend (Node.js/Express API) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescuebytes-backend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Expose for direct API access if needed
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      # Use MongoDB Atlas or local mongo service
      # If using Atlas, set MONGO_DB_URI in .env file
      # If using local mongo, uncomment the line below:
      # - MONGO_DB_URI=mongodb://mongo:27017/rescuebytes
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - rescuebytes-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/auth/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── MongoDB Database ──────────────────────────────────────────────────────
  # Optional: Comment out this service if using MongoDB Atlas
  mongo:
    image: mongo:7
    container_name: rescuebytes-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      # Optional: Add authentication
      # - MONGO_INITDB_ROOT_USERNAME=admin
      # - MONGO_INITDB_ROOT_PASSWORD=your_secure_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rescuebytes-net

volumes:
  mongo-data:
    driver: local

networks:
  rescuebytes-net:
    driver: bridge
