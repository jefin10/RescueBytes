server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy all backend API routes to the backend container ────────────────
    # Add any new top-level backend routes to this pattern.
    location ~ ^/(auth|news|chat|sos|signup|registercom|volunteerSignup|addAlert|addInventory|manageInv|emergencyReport|invReqRc|addUserReq|approveUserReq|rejectUserReq|deleteAlert|addComRep|approveComReq|comReportsRejected|addVolunteerMessage|deleteSOS|getComRepAdm|getComRepUser|getInvReqRc|getUserReq|getUserReqbyId|getAlerts|getLatestAlerts|getInv|getRC|getUsers|getVolunteers|getVolMessagebyId|getStats|getRCName|addRC|hash|health|dangerZone|safeRoute|geo)(/|$) {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 60s;
    }

    # ── React SPA – serve static assets or fall back to index.html ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
